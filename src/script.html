/* =========================================================
   CHIS DISPLAY THEME
========================================================= */

function getEffectiveCHISTheme(
  preference
) {

  const value =
    String(
      preference || "system"
    )
      .trim()
      .toLowerCase();


  if (
    value === "dark"
  ) {

    return "dark";

  }


  if (
    value === "default"
  ) {

    return "default";

  }


  return (

    window.matchMedia &&
    window.matchMedia(
      "(prefers-color-scheme: dark)"
    ).matches

  )

    ? "dark"

    : "default";

}


function applyCHISTheme(
  preference
) {

  currentCHISTheme =

    [
      "default",
      "dark",
      "system"
    ].includes(
      String(
        preference || ""
      )
        .trim()
        .toLowerCase()
    )

      ? String(
          preference
        )
          .trim()
          .toLowerCase()

      : "system";


  const effectiveTheme =
    getEffectiveCHISTheme(
      currentCHISTheme
    );


  document.documentElement
    .setAttribute(
      "data-chis-theme",
      effectiveTheme
    );


  document.documentElement
    .setAttribute(
      "data-chis-theme-preference",
      currentCHISTheme
    );

}


function initializeCHISSystemThemeListener() {

  if (
    !window.matchMedia
  ) {

    return;

  }


  chisSystemThemeMedia =
    window.matchMedia(
      "(prefers-color-scheme: dark)"
    );


  const handler = () => {

    if (
      currentCHISTheme ===
        "system"
    ) {

      applyCHISTheme(
        "system"
      );

    }

  };


  if (
    typeof chisSystemThemeMedia
      .addEventListener ===
      "function"
  ) {

    chisSystemThemeMedia
      .addEventListener(
        "change",
        handler
      );

  } else if (
    typeof chisSystemThemeMedia
      .addListener ===
      "function"
  ) {

    chisSystemThemeMedia
      .addListener(
        handler
      );

  }

}

function saveCHISThemePreference() {

  const select =
    document.getElementById(
      "chisThemePreference"
    );


  const messageBox =
    document.getElementById(
      "chisThemeMessage"
    );


  if (!select) {

    return;

  }


  const theme =
    select.value;


  applyCHISTheme(
    theme
  );


  if (messageBox) {

    messageBox.style.color =
      "#64748b";

    messageBox.textContent =
      "Saving display preference...";

  }


  google.script.run

    .withSuccessHandler(result => {

      if (
        result &&
        result.success
      ) {

        currentCHISTheme =
          result.themePreference ||
          theme;


        if (
          currentCHISUser
        ) {

          currentCHISUser.themePreference =
            currentCHISTheme;

        }


        applyCHISTheme(
          currentCHISTheme
        );


        if (messageBox) {

          messageBox.style.color =
            "#146c2e";

          messageBox.textContent =
            "Display preference saved.";

        }


        return;

      }


      if (messageBox) {

        messageBox.style.color =
          "#b42318";

        messageBox.textContent =

          result &&
          result.message

            ? result.message

            : "Unable to save display preference.";

      }

    })


    .withFailureHandler(error => {

      if (messageBox) {

        messageBox.style.color =
          "#b42318";

        messageBox.textContent =

          error &&
          error.message

            ? error.message

            : "Unable to save display preference.";

      }

    })


    .updateCHISThemePreference(
      chisSessionToken,
      theme
    );

}


/* =========================================================
   INITIALIZE CHIS
========================================================= */

function initializeCHIS() {

  /*
   * Load app preferences in background.
   */
  loadCHISSettings();

  /*
   * Restore an existing CHIS session when possible.
   * Otherwise show the manual login screen.
   */
  if (chisSessionToken) {

    validateStoredCHISSession();

  } else {

    showLoginScreen();

  }

}


/* =========================================================
   RESTORE CHIS SESSION
========================================================= */

function validateStoredCHISSession() {

  google.script.run

    .withSuccessHandler(result => {

      if (
        result &&
        result.authorized === true &&
        result.user
      ) {

        applyCurrentUser(
          result.user
        );

        userProfileReady = true;

        showWelcome();

        syncFavoritesState();

        return;

      }


      chisSessionToken = "";

      localStorage.removeItem(
        "chis_session_token"
      );

      showLoginScreen();

    })


    .withFailureHandler(() => {

      chisSessionToken = "";

      localStorage.removeItem(
        "chis_session_token"
      );

      showLoginScreen();

    })


    .validateCHISSessionV307(
      chisSessionToken
    );

}

function togglePasswordVisibility(inputId, button) {

  const input =
    document.getElementById(
      inputId
    );

  if (!input) {
    return;
  }

  const isHidden =
    input.type === "password";

  input.type =
    isHidden
      ? "text"
      : "password";

  if (button) {

    button.textContent =
      isHidden
        ? "🙈"
        : "👁️";

    button.title =
      isHidden
        ? "Hide password"
        : "Show password";

    button.setAttribute(
      "aria-label",
      isHidden
        ? "Hide password"
        : "Show password"
    );

  }

}

/* =========================================================
   ANIMATED LAMP LOGIN
========================================================= */

function toggleCHISLoginLamp(forceOn) {

  const stage = document.getElementById("chisLoginStage");
  const panel = document.getElementById("chisLoginPanel");
  const cord = document.getElementById("chisLampCord");

  if (!stage || !panel || !cord) return;

  const turnOn = typeof forceOn === "boolean"
    ? forceOn
    : !stage.classList.contains("is-lit");

  stage.classList.toggle("is-lit", turnOn);
  cord.setAttribute("aria-pressed", String(turnOn));
  cord.setAttribute("aria-label", turnOn
    ? "Turn off the login lamp"
    : "Turn on the lamp and reveal login");
  panel.setAttribute("aria-hidden", String(!turnOn));
  panel.inert = !turnOn;

  if (turnOn) {
    window.setTimeout(() => {
      const username = document.getElementById("chisLoginUsername");
      if (username) username.focus();
    }, 520);
  } else {
    window.setTimeout(() => cord.focus(), 120);
  }

}


/* =========================================================

========================================================= */

function openCHISForgotPassword() {
  let modal = document.getElementById("chisForgotPasswordModal");
  if (!modal) {
    modal = document.createElement("div");
    modal.id = "chisForgotPasswordModal";
    modal.className = "chis-reset-modal";
    modal.setAttribute("role", "dialog");
    modal.setAttribute("aria-modal", "true");
    modal.setAttribute("aria-labelledby", "chisResetTitle");
    modal.innerHTML = `
      <div class="chis-reset-dialog">
        <button type="button" class="chis-reset-close" aria-label="Close"
          onclick="closeCHISForgotPassword()">×</button>
        <div class="chis-reset-icon" aria-hidden="true">🔑</div>
        <span>ACCOUNT RECOVERY</span>
        <h2 id="chisResetTitle">Forgot your password?</h2>
        <p>Enter your CHIS username. The Administrator will review the request and provide a temporary password.</p>
        <label for="chisResetUsername">Username</label>
        <div class="chis-reset-field">
          <span aria-hidden="true">◉</span>
          <input id="chisResetUsername" type="text" autocomplete="username"
            autocapitalize="none" spellcheck="false" placeholder="Enter your username"
            onkeydown="if(event.key==='Enter'){event.preventDefault();submitCHISForgotPassword();}">
        </div>
        <button id="chisResetSubmit" type="button" class="chis-login-submit"
          onclick="submitCHISForgotPassword()"><span>Send Reset Request</span><b aria-hidden="true">→</b></button>
        <div id="chisResetMessage" class="chis-reset-message" aria-live="polite"></div>
        <small>No email is required. For security, only the CHIS Administrator can issue a temporary password.</small>
      </div>`;
    modal.addEventListener("click", event => {
      if (event.target === modal) closeCHISForgotPassword();
    });
    document.body.appendChild(modal);
  }

  const loginUsername = document.getElementById("chisLoginUsername");
  const resetUsername = document.getElementById("chisResetUsername");
  const message = document.getElementById("chisResetMessage");
  if (message) { message.textContent = ""; message.className = "chis-reset-message"; }
  if (resetUsername) resetUsername.value = loginUsername ? loginUsername.value.trim() : "";
  modal.classList.add("is-open");
  modal.setAttribute("aria-hidden", "false");
  window.setTimeout(() => { if (resetUsername) resetUsername.focus(); }, 80);
}

function closeCHISForgotPassword() {
  const modal = document.getElementById("chisForgotPasswordModal");
  if (!modal) return;
  modal.classList.remove("is-open");
  modal.setAttribute("aria-hidden", "true");
  const button = document.getElementById("chisForgotPasswordButton");
  if (button) button.focus();
}

function submitCHISForgotPassword() {
  const input = document.getElementById("chisResetUsername");
  const button = document.getElementById("chisResetSubmit");
  const message = document.getElementById("chisResetMessage");
  const username = input ? input.value.trim().toLowerCase() : "";

  if (!username) {
    if (message) { message.className = "chis-reset-message is-error"; message.textContent = "Please enter your username."; }
    if (input) input.focus();
    return;
  }

  if (button) { button.disabled = true; button.querySelector("span").textContent = "Sending request..."; }
  if (message) { message.className = "chis-reset-message"; message.textContent = "Submitting securely..."; }

  google.script.run
    .withSuccessHandler(result => {
      if (button) { button.disabled = false; button.querySelector("span").textContent = "Send Reset Request"; }
      if (message) {
        message.className = "chis-reset-message " + (result && result.success ? "is-success" : "is-error");
        message.textContent = result && result.message ? result.message : "Unable to submit the request.";
      }
      if (result && result.success && input) input.disabled = true;
    })
    .withFailureHandler(() => {
      if (button) { button.disabled = false; button.querySelector("span").textContent = "Send Reset Request"; }
      if (message) { message.className = "chis-reset-message is-error"; message.textContent = "Unable to submit the request. Please try again."; }
    })
    .requestCHISPasswordResetV309(username);
}

/* =========================================================
   SUBMIT REGISTRATION
========================================================= */

function submitCHISRegistration() {

  const usernameInput =
    document.getElementById(
      "registerUsername"
    );

  const fullNameInput =
    document.getElementById(
      "registerFullName"
    );

  const passwordInput =
    document.getElementById(
      "registerPassword"
    );

  const confirmPasswordInput =
    document.getElementById(
      "registerConfirmPassword"
    );

  const hospitalInput =
    document.getElementById(
      "registerHospital"
    );

  const customHospitalInput =
    document.getElementById(
      "registerCustomHospital"
    );

  const facilityTypeInput =
    document.getElementById(
      "registerFacilityType"
    );

  const messageBox =
    document.getElementById(
      "registrationMessage"
    );


  const selectedHospital =
    hospitalInput
      ? hospitalInput.value.trim()
      : "";


  const customHospital =
    customHospitalInput
      ? customHospitalInput.value.trim()
      : "";


  const hospital =
    selectedHospital ===
      "Other / Not Listed"

      ? customHospital

      : selectedHospital;


  const profile = {

    username:
      usernameInput
        ? usernameInput.value.trim()
        : "",

    fullName:
      fullNameInput
        ? fullNameInput.value.trim()
        : "",

    password:
      passwordInput
        ? passwordInput.value
        : "",

    confirmPassword:
      confirmPasswordInput
        ? confirmPasswordInput.value
        : "",

    hospital:
      hospital,

    facilityType:
      facilityTypeInput
        ? facilityTypeInput.value
        : ""

  };


  if (!profile.username) {

    setRegistrationMessage(
      messageBox,
      "Please enter your username.",
      false
    );

    return;

  }


  if (!profile.fullName) {

    setRegistrationMessage(
      messageBox,
      "Please enter your full name.",
      false
    );

    return;

  }


  if (
    profile.password.length < 8 ||
    !/[A-Z]/.test(profile.password) ||
    !/[a-z]/.test(profile.password) ||
    !/[0-9]/.test(profile.password) ||
    !/[^A-Za-z0-9]/.test(profile.password)
  ) {

    setRegistrationMessage(
      messageBox,
      "Use 8+ characters with uppercase, lowercase, number and special character.",
      false
    );

    return;

  }


  if (
    profile.password !==
    profile.confirmPassword
  ) {

    setRegistrationMessage(
      messageBox,
      "Passwords do not match.",
      false
    );

    return;

  }


  if (!profile.hospital) {

    setRegistrationMessage(
      messageBox,
      "Please select or enter your hospital/facility.",
      false
    );

    return;

  }


  if (!profile.facilityType) {

    setRegistrationMessage(
      messageBox,
      "Please select your facility type.",
      false
    );

    return;

  }


  setRegistrationMessage(
    messageBox,
    "Creating your CHIS account...",
    true
  );


  google.script.run

    .withSuccessHandler(result => {

      if (
        result &&
        result.success
      ) {

        showPendingApproval({

          username:
            profile.username,

          user:
            result.user || {

              fullName:
                profile.fullName,

              hospital:
                profile.hospital,

              facilityType:
                profile.facilityType

            }

        });

        return;

      }


      setRegistrationMessage(

        messageBox,

        result &&
        result.message

          ? result.message

          : "Unable to create your CHIS account.",

        false

      );

    })


    .withFailureHandler(error => {

      setRegistrationMessage(

        messageBox,

        error &&
        error.message

          ? error.message

          : "Unable to create your CHIS account.",

        false

      );

    })


    .registerCHISAccountV307(
      profile
    );

}

/* =========================================================
   CONTINUE / LOGIN TO CHIS
========================================================= */

function continueToCHIS() {

  const usernameInput =
    document.getElementById(
      "chisLoginUsername"
    );

  const passwordInput =
    document.getElementById(
      "chisLoginPassword"
    );

  const button =
    document.getElementById(
      "chisLoginButton"
    );

  const message =
    document.getElementById(
      "loginMessage"
    );


  const credentials = {

    username:
      usernameInput
        ? usernameInput.value.trim()
        : "",

    password:
      passwordInput
        ? passwordInput.value
        : ""

  };


  if (
    !credentials.username ||
    !credentials.password
  ) {

    showLoginError(
      "Please enter your username and password."
    );

    return;

  }


  if (button) {

    button.disabled = true;

    button.innerHTML =
      "⏳ Signing In...";

  }


  if (message) {

    message.style.color =
      "#64748b";

    message.textContent =
      "Checking your CHIS credentials...";

  }


  google.script.run

    .withSuccessHandler(result => {

      if (!result) {

        showLoginError(
          "Unable to verify your account."
        );

        return;

      }


      if (
        result.reason === "USER_PENDING" ||
        result.pendingApproval === true
      ) {

        showPendingApproval(
          result
        );

        return;

      }


      if (
        result.reason === "USER_INACTIVE" ||
        result.accessDenied === true
      ) {

        showAccessDenied(

          "Access Denied",

          result.message ||
          "Your CHIS account is currently inactive. Please contact the CHIS administrator for assistance.",

          credentials.username

        );

        return;

      }


      if (
        result.success === true &&
        result.authorized === true &&
        result.sessionToken &&
        result.user
      ) {

        chisSessionToken =
          result.sessionToken;


        localStorage.setItem(

          "chis_session_token",

          chisSessionToken

        );


        applyCurrentUser(
          result.user
        );

        userProfileReady = true;

        showWelcome();

        syncFavoritesState();

        if (result.mustChangePassword === true) {
          setTimeout(() => {
            alert("Your temporary password must be changed now.");
            showAccountSettings();
          }, 400);
        }

        return;

      }


      showLoginError(

        result.message ||

        "Invalid username or password."

      );

    })


    .withFailureHandler(error => {

      showLoginError(

        error &&
        error.message

          ? error.message

          : "Unable to connect to the CHIS authentication service."

      );

    })


    .loginCHISAccountV307(
      credentials
    );

}

/* =========================================================
   APPLY CURRENT USER PROFILE
========================================================= */

function applyCurrentUser(user) {

  resetCHISIdleTimer();

  currentCHISUser =
    user || null;


  if (!currentCHISUser) {
    return;
  }


  applyCHISTheme(

    currentCHISUser.themePreference

      ||

    "system"

  );


  /*
   * Override facility identity using
   * the logged-in user's own profile.
   */
  chisSettings.facilityName =

    currentCHISUser.hospital ||

    chisSettings.facilityName;


  chisSettings.facilityType =

    currentCHISUser.facilityType ||

    chisSettings.facilityType;


  /*
   * Update header with current user's name.
   */
  const headerUserName =
    document.getElementById(
      "headerUserName"
    );


  if (headerUserName) {

    headerUserName.textContent =

      "👤 " +

      (
        currentCHISUser.fullName ||

        currentCHISUser.username ||

        "CHIS User"
      );

  }


  /*
   * Show logout button after successful login.
   */
  const logoutButton =
    document.getElementById(
      "logoutButton"
    );


  if (logoutButton) {

    logoutButton.style.display =
      "inline-flex";

  }


  /*
   * Show User Management only for ADMIN users.
   */
  const adminMenuButton =
    document.getElementById(
      "menuUserManagement"
    );


  if (adminMenuButton) {

    const isAdmin =

      String(
        currentCHISUser.role || ""
      )
        .trim()
        .toUpperCase()

      ===

      "ADMIN";


    adminMenuButton.style.display =

      isAdmin

        ? "block"

        : "none";


    if (isAdmin) {

      refreshPendingUsersBadge();

    } else {

      updatePendingUsersBadge(0);

    }

  }

}

/* =========================================================
   SAVE PROFILE SETUP
========================================================= */

function saveProfileSetup(
  encodedUsername
) {

  const fullNameInput =
    document.getElementById(
      "profileFullName"
    );

  const hospitalInput =
    document.getElementById(
      "profileHospital"
    );

  const customHospitalInput =
    document.getElementById(
      "profileCustomHospital"
    );

  const facilityTypeInput =
    document.getElementById(
      "profileFacilityType"
    );

  const messageBox =
    document.getElementById(
      "profileMessage"
    );


  const selectedHospital =

    hospitalInput
      ? hospitalInput.value.trim()
      : "";


  const customHospital =

    customHospitalInput
      ? customHospitalInput.value.trim()
      : "";


  const hospital =

    selectedHospital ===
      "Other / Not Listed"

      ? customHospital

      : selectedHospital;


  const profile = {

    username:
      decodeURIComponent(
        encodedUsername || ""
      ),

    fullName:
      fullNameInput
        ? fullNameInput.value.trim()
        : "",

    hospital:
      hospital,

    facilityType:
      facilityTypeInput
        ? facilityTypeInput.value
        : ""

  };


  if (!profile.fullName) {

    setProfileMessage(
      messageBox,
      "Please enter your full name.",
      false
    );

    return;

  }


  if (!profile.hospital) {

    setProfileMessage(
      messageBox,
      "Please select or enter your hospital.",
      false
    );

    return;

  }


  if (!profile.facilityType) {

    setProfileMessage(
      messageBox,
      "Please select your facility type.",
      false
    );

    return;

  }


  setProfileMessage(
    messageBox,
    "Saving your profile...",
    true
  );


  google.script.run

    .withSuccessHandler(result => {

      if (
        result &&
        result.success &&
        result.user
      ) {

        applyCurrentUser(
          result.user
        );

        userProfileReady = true;


        /*
         * Keep legacy facility settings synchronized
         * so existing applicability logic continues
         * to work with the current user.
         */
        chisSettings.facilityName =
          result.user.hospital;

        chisSettings.facilityType =
          result.user.facilityType;


        showWelcome();

      } else {

        setProfileMessage(

          messageBox,

          result &&
          result.message

            ? result.message

            : "Unable to save profile.",

          false

        );

      }

    })

    .withFailureHandler(error => {

      setProfileMessage(

        messageBox,

        error &&
        error.message

          ? error.message

          : "Unable to save profile.",

        false

      );

    })

    .saveCHISUserProfileV307(
      chisSessionToken,
      profile
    );

}

/* =========================================================
   OFFLINE SEARCH CACHE
========================================================= */

const CHIS_OFFLINE_CACHE_PREFIX = "chis_offline_search_v5_";

function normalizeOfflineCacheKey(keyword) {
  return CHIS_OFFLINE_CACHE_PREFIX +
    String(keyword || "").trim().toLowerCase();
}

function saveOfflineSearchCache(keyword) {
  try {
    const key = normalizeOfflineCacheKey(keyword);
    const existing = loadOfflineSearchCache(keyword) || {};

    const payload = {
      keyword: String(keyword || "").trim(),
      savedAt: new Date().toISOString(),
      liveData:
        liveSearchStatus === "done"
          ? latestLiveData
          : (existing.liveData || []),
      localData:
        localSearchStatus === "done"
          ? latestLocalData
          : (existing.localData || [])
    };

    localStorage.setItem(
      key,
      JSON.stringify(payload)
    );
  } catch (error) {
    console.warn("CHIS offline cache save failed:", error);
  }
}

function loadOfflineSearchCache(keyword) {
  try {
    const raw = localStorage.getItem(
      normalizeOfflineCacheKey(keyword)
    );

    return raw
      ? JSON.parse(raw)
      : null;
  } catch (error) {
    console.warn("CHIS offline cache load failed:", error);
    return null;
  }
}

function applyOfflineCacheFallback(keyword) {
  const cached = loadOfflineSearchCache(keyword);

  if (!cached) {
    return false;
  }

  let usedCache = false;

  if (
    liveSearchStatus === "error" &&
    Array.isArray(cached.liveData)
  ) {
    latestLiveData = cached.liveData;
    liveSearchStatus = "done";
    liveSearchError = null;
    usedCache = true;
  }

  if (
    chisSettings.showLocalDatabase !== false &&
    localSearchStatus === "error" &&
    Array.isArray(cached.localData)
  ) {
    latestLocalData = cached.localData;
    localSearchStatus = "done";
    localSearchError = null;
    usedCache = true;
  }

  return usedCache;
}

function buildOfflineModeBanner(keyword) {
  const cached = loadOfflineSearchCache(keyword);

  if (!cached) {
    return "";
  }

  let savedLabel = "";

  try {
    savedLabel = cached.savedAt
      ? new Date(cached.savedAt).toLocaleString()
      : "";
  } catch (error) {}

  return `
    <div
      style="
        margin-bottom:18px;
        padding:14px 16px;
        border-radius:8px;
        background:#fff1f0;
        border:1px solid #fecaca;
        color:#b42318;
        line-height:1.6;
        font-weight:700;
      ">
      🔴 Offline Mode — Showing saved CHIS data
      ${
        savedLabel
          ? `<div style="font-size:12px;font-weight:500;margin-top:4px;">
               Last saved: ${escapeHtml(savedLabel)}
             </div>`
          : ""
      }
    </div>
  `;
}

    .replace(/\s+/g, "")
    .replace(/[†‡]+$/g, "")
    .replace(/\*+$/g, "")
    .trim();

}


/* Verified safety net for the single combined ACR code. */

/*

 * Accept the printed CRS form and harmless spacing/symbol variations, but
 * always return one linked record rather than two independent codes.
 */

  const compact =
    String(value || "")
      .toUpperCase()
      .replace(/\u00A0/g, " ")

  const verifiedPairs = {

      description: "INSULIN-DEPENDENT DIABETES MELLITUS WITH RENAL COMPLICATIONS; GLOMERULAR DISORDERS IN DIABETES MELLITUS"

  };

  return verifiedPairs[compact] || null;

}


function isCHISVerifiedDiabeticRenalPair(value) {

function buildCHISSearchVariants(keyword) {

  const original =
    String(keyword || "")
      .replace(/\u00A0/g, " ")
      .trim();

  const variants = [];

  const addVariant = value => {

    const candidate =
      String(value || "").trim();

    if (!candidate) {
      return;
    }

    const exists =
      variants.some(
        item =>
          item.toUpperCase() ===
          candidate.toUpperCase()
      );

    if (!exists) {
      variants.push(candidate);
    }

  };

  addVariant(original);

  /*
   * PhilHealth ICD entries may use legitimate trailing
   * notation such as D63.8*. Some CRS/database search
   * endpoints only return the record when the base code
   * (D63.8) is submitted. Keep the original query first,
   * then safely retry using the base code.
   */
  addVariant(
    original.replace(/[†‡*]+$/g, "").trim()
  );

  return variants;

}


function filterCHISResultsForRequestedCode(
  data,
  requestedKeyword
) {

  if (!Array.isArray(data)) {
    return [];
  }

  const requestedCode =
    normalizeCHISMedicalCodeForMatch(
      requestedKeyword
    );

  if (!requestedCode) {
    return data;
  }

  const exactEquivalent =
    data.filter(item =>
      CHISResultCodeMatchesRequest(
        item && item.code,
        requestedKeyword
      )
    );

  /*
   * Never show a different code for an exact medical-code query.
   * This prevents P59.9 from incorrectly falling back to L03.1.
   * Description/keyword searches still retain normal partial results.
   */
  return isCHISMedicalCodeQuery(requestedKeyword)
    ? exactEquivalent
    : (exactEquivalent.length > 0 ? exactEquivalent : data);

}


function runCHISSearchVariants(
  variants,
  requestFunction,
  onSuccess,
  onFailure
) {

  const queue =
    Array.isArray(variants)
      ? variants.slice()
      : [];

  let lastEmptyResult = [];

  const tryNext = () => {

    if (queue.length === 0) {
      onSuccess(lastEmptyResult);
      return;
    }

    const query = queue.shift();

    requestFunction(
      query,
      result => {

        const rows =
          Array.isArray(result)
            ? result
            : [];

        if (rows.length > 0) {
          onSuccess(rows, query);
          return;
        }

        lastEmptyResult = rows;
        tryNext();

      },
      error => {

        /*
         * If another safe variant remains, try it first.
         * Only surface the error after all variants fail.
         */
        if (queue.length > 0) {
          tryNext();
          return;
        }

        onFailure(error);

      }
    );

  };

  tryNext();

}


function requestCHISLocalDatabase(
  query,
  onSuccess,
  onFailure
) {

  google.script.run
    .withSuccessHandler(onSuccess)
    .withFailureHandler(onFailure)
    .searchDatabase(query);

}


function requestCHISLiveTimeline(
  query,
  onSuccess,
  onFailure
) {

  google.script.run
    .withSuccessHandler(onSuccess)
    .withFailureHandler(onFailure)
    .getTimeline(query);

}


function performSearch(keyword) {

  showCHISSearchBar();

  keyword =
    String(keyword || "").trim();

  currentSearchKeyword = keyword;

  if (keyword.length < 2) {
    return;
  }

  const searchVariants =
    buildCHISSearchVariants(keyword);

  /*
   * Each search gets a unique token.
   * Older/slower responses are ignored.
   */
  const searchToken =
    ++currentSearchToken;

  latestLiveData = [];
  latestLocalData = [];

  liveSearchStatus = "loading";
  localSearchStatus = "loading";

  liveSearchError = null;
  localSearchError = null;

  renderCurrentSearch();


  /* ==========================================
     LOCAL DATABASE REQUEST
     ========================================== */
  if (chisSettings.showLocalDatabase === false) {

    localSearchStatus = "done";
    latestLocalData = [];

  } else {

    runCHISSearchVariants(
      searchVariants,
      requestCHISLocalDatabase,
      localData => {

        if (
          searchToken !==
          currentSearchToken
        ) {
          return;
        }

        latestLocalData =
          filterCHISResultsForRequestedCode(
            localData,
            keyword
          );

        if (
          latestLocalData.length === 0 &&
          isCHISVerifiedNosocomialCode(keyword)
        ) {
          latestLocalData = getCHISVerifiedNosocomialLocalResult();
        }

        if (
          latestLocalData.length === 0 &&
          isCHISVerifiedDiabeticRenalPair(keyword)
        ) {
          latestLocalData = getCHISVerifiedDiabeticRenalLocalResult(keyword);
        }

        localSearchStatus = "done";

        saveOfflineSearchCache(keyword);
        renderCurrentSearch();

      },
      error => {

        if (
          searchToken !==
          currentSearchToken
        ) {
          return;
        }

        if (isCHISVerifiedNosocomialCode(keyword)) {
          latestLocalData = getCHISVerifiedNosocomialLocalResult();
          localSearchStatus = "done";
          localSearchError = null;
        } else if (isCHISVerifiedDiabeticRenalPair(keyword)) {
          latestLocalData = getCHISVerifiedDiabeticRenalLocalResult(keyword);
          localSearchStatus = "done";
          localSearchError = null;
        } else {
          latestLocalData = [];
          localSearchStatus = "error";
          localSearchError = error;
        }

        applyOfflineCacheFallback(keyword);
        renderCurrentSearch();

      }
    );

  }


  /* ==========================================
     LIVE PHILHEALTH CRS REQUEST
     ========================================== */
  runCHISSearchVariants(
    searchVariants,
    requestCHISLiveTimeline,
    liveData => {
console.log("LIVE DATA:", liveData);
console.log("COUNT:", Array.isArray(liveData) ? liveData.length : "Not Array");
      if (
        searchToken !==
        currentSearchToken
      ) {
        return;
      }

      latestLiveData =
        filterCHISResultsForRequestedCode(
          liveData,
          keyword
        );

      if (
        latestLiveData.length === 0 &&
        isCHISVerifiedNosocomialCode(keyword)
      ) {
        latestLiveData = getCHISVerifiedNosocomialLiveResult();
      }

      if (
        latestLiveData.length === 0 &&
        isCHISVerifiedDiabeticRenalPair(keyword)
      ) {
        latestLiveData = getCHISVerifiedDiabeticRenalLiveResult(keyword);
      }
console.log("FILTERED:", latestLiveData);
console.log("FILTERED COUNT:", latestLiveData.length);

      liveSearchStatus = "done";

      saveOfflineSearchCache(keyword);
      renderCurrentSearch();

      syncLiveCRSToLocalDatabase(
        latestLiveData
      );

      if (
        latestLiveData.length > 0 &&
        searchToken === currentSearchToken
      ) {

        saveSuccessfulSearchToHistory(
          keyword,
          latestLiveData
        );

      }

    },
    error => {

      if (
        searchToken !==
        currentSearchToken
      ) {
        return;
      }

      if (isCHISVerifiedNosocomialCode(keyword)) {
        latestLiveData = getCHISVerifiedNosocomialLiveResult();
        liveSearchStatus = "done";
        liveSearchError = null;
      } else if (isCHISVerifiedDiabeticRenalPair(keyword)) {
        latestLiveData = getCHISVerifiedDiabeticRenalLiveResult(keyword);
        liveSearchStatus = "done";
        liveSearchError = null;
      } else {
        latestLiveData = [];
        liveSearchStatus = "error";
        liveSearchError = error;
      }

      applyOfflineCacheFallback(keyword);
      renderCurrentSearch();

    }
  );

}


/* =========================================================
   CRS -> LOCAL DATABASE BACKGROUND AUTO-SYNC
========================================================= */

function syncLiveCRSToLocalDatabase(
  liveData
) {

  if (
    !Array.isArray(
      liveData
    )

    ||

    liveData.length === 0
  ) {

    return;

  }


  google.script.run

    .withSuccessHandler(summary => {

      if (!summary) {

        return;

      }


      if (
        Number(
          summary.added || 0
        ) > 0

        ||

        Number(
          summary.updated || 0
        ) > 0
      ) {

        console.log(
          "CHIS local database synchronized:",
          summary
        );

      }

    })


    .withFailureHandler(error => {

      console.warn(
        "CHIS local database auto-sync failed:",
        error
      );

    })


    .syncCRSResultsToLocalDatabase(
      liveData
    );

}

/* =========================================================
   PARALLEL RESULT RENDERER
========================================================= */

function renderParallelResults(options = {}) {

  const liveStatus =
    options.liveStatus ||
    "loading";

  const localStatus =
    options.localStatus ||
    "loading";

  const liveError =
    options.liveError ||
    null;

  const localError =
    options.localError ||
    null;


  let html = "";


  if (
    typeof navigator !== "undefined" &&
    navigator.onLine === false
  ) {

    html +=
      buildOfflineModeBanner(
        currentSearchKeyword
      );

  }


  /* =====================================
     LIVE CRS SECTION
  ===================================== */

  html += `

    <div class="section-title">

      Current PhilHealth CRS

    </div>

  `;


  if (
    liveStatus === "done"
  ) {

    if (
      latestLiveData &&
      latestLiveData.length > 0
    ) {

      latestLiveData.forEach(
        (group, groupIndex) => {

          html +=
            buildLiveResult(
              group,
              groupIndex
            );

        }
      );

    } else {

      html += `

        <div class="card">

          <div class="type">
            LIVE CRS
          </div>

          <div style="margin-top:10px;">

            No live CRS result found.

          </div>

        </div>

      `;

    }

  }

  else if (
    liveStatus === "error"
  ) {

    html += `

      <div class="card">

        <div class="type">
          LIVE CRS
        </div>

        <div style="margin-top:10px;">

          ⚠ Unable to load live CRS result.

          ${
            liveError &&
            liveError.message

              ? `<br><small>${escapeHtml(
                  liveError.message
                )}</small>`

              : ""
          }

        </div>

      </div>

    `;

  }

  else {

    html += `

      <div class="card">

        <div class="type">
          LIVE CRS
        </div>

        <div style="margin-top:10px;">

          ⏳ Checking latest official case rate...

        </div>

      </div>

    `;

  }


  /* =====================================
     LOCAL DATABASE SECTION
  ===================================== */

  if (chisSettings.showLocalDatabase !== false) {

    html += `

      <div class="section-title">

        Local Database Reference

      </div>

    `;


    if (
      localStatus === "done"
    ) {

    if (
      latestLocalData &&
      latestLocalData.length > 0
    ) {

      latestLocalData.forEach(local => {

        const liveMatch =

          findLiveMatch(

            latestLiveData,

            local.code

          );


        html +=

          buildLocalResult(

            local,

            liveMatch

          );

      });

    } else {

      html += `

        <div class="card">

          No local database result found.

        </div>

      `;

    }

  }

  else if (
    localStatus === "error"
  ) {

    html += `

      <div class="card">

        <div class="type">
          LOCAL DATABASE
        </div>

        <div style="margin-top:10px;">

          ⚠ Unable to search local database.

          ${
            localError &&
            localError.message

              ? `<br><small>${escapeHtml(
                  localError.message
                )}</small>`

              : ""
          }

        </div>

      </div>

    `;

  }

  else {

    html += `

      <div class="card">

        <div class="type">
          LOCAL DATABASE
        </div>

        <div style="margin-top:10px;">

          ⏳ Searching local database...

        </div>

      </div>

    `;

  }


  }

  resultsBox.innerHTML = html;

}

function isCHISMedicalCodeQuery(value) {

  return /^[A-Z][0-9]{2}(?:\.[A-Z0-9]+)?(?:\s*(?:\+|,)\s*[A-Z][0-9]{2}(?:\.[A-Z0-9]+)?[*†‡]?)?$/i
    .test(String(value || "").trim());

}


function CHISResultCodeMatchesRequest(resultCode, requestedKeyword) {

  const requested =
    normalizeCHISMedicalCodeForMatch(requestedKeyword);

  const fullCode =
    normalizeCHISMedicalCodeForMatch(resultCode);

  if (fullCode === requested) {
    return true;
  }

  /* ACR combined codes are one complete Code value. Do not match a component. */
  return false;

}

function runAICodingSuggestion_() {

  const input = document.getElementById("aiFinalDiagnoses");

  const output = document.getElementById("aiCodingResults");
  const diagnosisText = input ? input.value.trim() : "";

  if (!diagnosisText) {
    if (status) status.innerHTML = `<div class="ai-status-error">Enter at least one final diagnosis.</div>`;
    if (input) input.focus();
    return;

  if (!chisSessionToken) {

  if (button) {
    button.disabled = true;
    button.textContent = "Analyzing…";
  }

  if (status) {

        <span class="ai-thinking-dot"></span>
        Detecting conditions, qualifiers, causal relationships, and validated ICD-10/CRS records…
      </div>
    `;
  }
  if (output) output.innerHTML = "";

  google.script.run
    .withSuccessHandler(result => {
      if (button) {
        button.disabled = false;
        button.textContent = "✦ Analyze diagnoses";
      }
      if (status) status.innerHTML = "";
      renderAICodingResults_(result);
    })
    .withFailureHandler(error => {
      if (button) {
        button.disabled = false;
        button.textContent = "✦ Analyze diagnoses";
      }
      if (status) {
        status.innerHTML = `<div class="ai-status-error">${escapeHtml(error && error.message ? error.message : "Unable to analyze the diagnoses.")}</div>`;
      }
    })
    .suggestCHISICDCodingAndCaseRate(
      chisSessionToken,
      diagnosisText,
      (currentCHISUser && currentCHISUser.facilityType) || chisSettings.facilityType
    );
}


function renderAICodingResults_(payload) {

  const output = document.getElementById("aiCodingResults");
  if (!output) return;

  const rows = payload && Array.isArray(payload.results) ? payload.results : [];
  const combinations = payload && Array.isArray(payload.combinations) ? payload.combinations : [];
  if (!rows.length) {
    output.innerHTML = `<div class="ai-status-error">No diagnosis result was returned.</div>`;
    return;
  }

  let html = `
    <div class="ai-result-summary">
      <div>
        <span>ANALYSIS COMPLETE</span>
        <h2>${Number(payload.conditionsDetected || rows.length)} condition${Number(payload.conditionsDetected || rows.length) === 1 ? "" : "s"} detected</h2>
      </div>
      <p>${Number(payload.statementsReviewed || rows.length)} statement${Number(payload.statementsReviewed || rows.length) === 1 ? "" : "s"} reviewed · ${escapeHtml(payload.sourcePolicy || "Validated CHIS records only")}</p>
    </div>
  `;

  if (combinations.length) {
    html += `<div class="ai-combination-list">`;
    combinations.forEach(combination => {
      html += `
        <section class="ai-combination-card">
          <div class="ai-combination-title">
            <span>DETECTED CODING RELATIONSHIP</span>
            <strong>${escapeHtml(combination.relation || "RELATED CONDITIONS")}</strong>
          </div>
          <p>${escapeHtml(combination.originalStatement || "")}</p>
          <div class="ai-relation-flow">
            <b>${escapeHtml(combination.leftRole || "FIRST CONDITION")}</b>
            <i>
              <span class="ai-relation-horizontal">→ ${escapeHtml(combination.relation || "RELATED TO")} →</span>
              <span class="ai-relation-vertical">↓ ${escapeHtml(combination.relation || "RELATED TO")} ↓</span>
            </i>
            <b>${escapeHtml(combination.rightRole || "SECOND CONDITION")}</b>
          </div>
          <small>${escapeHtml(combination.sequencingNote || "")}</small>
          <em>${escapeHtml(combination.claimRule || "")}</em>
        </section>
      `;
    });
    html += `</div>`;
  }

  rows.forEach((row, rowIndex) => {
    const candidates = Array.isArray(row.candidates) ? row.candidates : [];
    const typeLabel = row.diagnosisType || "Diagnosis candidate";

    html += `
      <article class="ai-diagnosis-result">
        <header class="ai-diagnosis-header">
          <span class="ai-diagnosis-number">${rowIndex + 1}</span>
          <div>
            <span class="ai-diagnosis-type">${escapeHtml(typeLabel)}</span>
            <h2>${escapeHtml(row.diagnosis || "")}</h2>
            ${row.componentRole ? `<small class="ai-component-role">${escapeHtml(row.componentRole)}</small>` : ""}
          </div>
        </header>
    `;

    if (!candidates.length) {
      html += `
        <div class="ai-no-match">
          <strong>No reliable local ICD-10 match</strong>
          <p>${escapeHtml(row.message || "Review the diagnosis wording and search manually.")}</p>
        </div>
      `;
    } else {
      html += `<div class="ai-candidate-list">`;
      candidates.forEach((candidate, candidateIndex) => {
        html += buildAICandidateCard_(candidate, candidateIndex, row.diagnosisType);
      });
      html += `</div>`;

      const questions = Array.isArray(row.codingQuestions) ? row.codingQuestions : [];
      if (questions.length) {
        html += `
          <div class="ai-coding-questions">
            <strong>Before confirming:</strong>
            <ul>${questions.map(question => `<li>${escapeHtml(question)}</li>`).join("")}</ul>
          </div>
        `;
      }
    }

    html += `</article>`;
  });

  html += `
    <div class="ai-final-warning">
      ${escapeHtml(payload.disclaimer || "Coder verification is required before claim submission.")}
    </div>
  `;

  output.innerHTML = html;
}


function buildAICandidateCard_(candidate, candidateIndex, diagnosisType) {

  const confidence = String(candidate.confidence || "LOW").toUpperCase();
  const first = candidate.firstCaseRate || {};
  const second = candidate.secondCaseRate || {};
  const hasFirst = first.available === true && Number(first.caseRate || 0) > 0;
  const hasSecond = second.available === true && Number(second.caseRate || 0) > 0;
  const facilityKnown = candidate.facilityApplicabilityKnown === true;
  const facilityApplicable = candidate.facilityApplicable === true;
  const confidenceClass = confidence.toLowerCase();
  const encodedCode = encodeURIComponent(candidate.code || "");

  let claimMessage = "No verified monetary case rate was found for this code.";
  if (hasFirst && String(diagnosisType || "").indexOf("PRINCIPAL") === 0) {
    claimMessage = hasSecond
      ? "Suggested as the possible first case rate. An allowed second case rate is also shown below, subject to PhilHealth rules and documented related conditions/procedures."
      : "Suggested as the possible first case rate, subject to complete documentation and eligibility verification.";
  } else if (hasFirst) {
    claimMessage = hasSecond
      ? "Possible secondary/second case-rate candidate; verify that this condition is allowed and related under current PhilHealth rules."
      : "A first case rate exists, but this secondary diagnosis is not automatically eligible as a second case rate.";
  }

  return `
    <section class="ai-candidate-card ${candidateIndex === 0 ? "ai-candidate-best" : ""}">
      <div class="ai-candidate-topline">
        <div class="ai-code-block">
          <span>${candidateIndex === 0 ? "RECOMMENDED MATCH" : `ALTERNATIVE ${candidateIndex}`}</span>
          <strong>${escapeHtml(candidate.code || "")}</strong>
        </div>
        <div class="ai-confidence ai-confidence-${confidenceClass}">
          ${escapeHtml(confidence)} · ${Number(candidate.score || 0)}%
        </div>
      </div>

      <h3>${escapeHtml(candidate.description || "")}</h3>
      <div class="ai-source-line">Source: ${escapeHtml(candidate.source || "CHIS ICD10_DB")}</div>
      ${candidate.indexRuleMatched && candidate.indexNote ? `<div class="ai-index-note"><strong>Index key matched:</strong> ${escapeHtml(candidate.indexNote)}</div>` : ""}

      <div class="ai-claim-message">${escapeHtml(claimMessage)}</div>

      ${hasFirst ? `
        <div class="ai-rate-grid">
          <div class="ai-rate-primary">
            <span>Possible first case rate</span>
            <strong>${formatPeso(first.caseRate)}</strong>
          </div>
          <div><span>HCI fee</span><strong>${formatPeso(first.hospitalFee)}</strong></div>
          <div><span>Professional fee</span><strong>${formatPeso(first.professionalFee)}</strong></div>
        </div>
      ` : `<div class="ai-rate-unavailable">No verified case rate found in the current CHIS record.</div>`}

      ${hasSecond ? `
        <div class="ai-second-rate">
          <div>
            <span>Possible allowed second case rate</span>
            <strong>${formatPeso(second.caseRate)}</strong>
          </div>
          <small>HCI ${formatPeso(second.hospitalFee)} · PF ${formatPeso(second.professionalFee)}</small>
          <b>Possible combined amount: ${formatPeso(candidate.possibleCombinedBenefit)}</b>
          <em>Estimate only—do not combine automatically without checking current second-case-rate rules.</em>
        </div>
      ` : ""}

      ${facilityKnown ? `
        <div class="ai-facility-status ${facilityApplicable ? "is-applicable" : "is-not-applicable"}">
          ${facilityApplicable ? "✓ Applicable" : "✕ Not applicable"} to the configured facility type
        </div>
      ` : `<div class="ai-facility-status is-unknown">Facility applicability requires CRS verification.</div>`}

      <div class="ai-candidate-actions">
        <button type="button" onclick="openAISuggestedCode_('${encodedCode}')">
          Verify in CHIS Search
        </button>
      </div>
    </section>
  `;
}


function openAISuggestedCode_(encodedCode) {

  const code = decodeURIComponent(encodedCode || "");
  const searchButton = document.getElementById("menuSearch");
  if (searchButton) searchButton.click();
  if (txt) {
    txt.value = code;
    updateClearSearchButton();
    performSearch(code);
  }
}

    updateFavoritesCountBadge();

    if (
      typeof onComplete ===
      "function"
    ) {

      onComplete(
        []
      );

    }

    return;

  }


  google.script.run

    .withSuccessHandler(data => {

      const favorites =

        Array.isArray(
          data
        )

          ? data

          : [];


      currentFavoriteRecords =
        favorites;


      syncedFavoriteCodes =

        new Set(

          favorites

            .map(
              item =>

                String(
                  item.code || ""
                )
                  .trim()
                  .toUpperCase()
            )

            .filter(
              Boolean
            )

        );


      updateFavoritesCountBadge();


      refreshFavoriteButtons();


      if (
        typeof onComplete ===
        "function"
      ) {

        onComplete(
          favorites
        );

      }

    })


    .withFailureHandler(() => {

      if (
        typeof onComplete ===
        "function"
      ) {

        onComplete(
          currentFavoriteRecords
        );

      }

    })


    .getCHISFavorites(
      chisSessionToken
    );

}


function isCodeFavorite(code) {

  return syncedFavoriteCodes.has(

    String(
      code || ""

      .trim()
      .toUpperCase()

  );

}


function updateFavoritesCountBadge() {

  const button =
    document.getElementById(
      "menuFavorites"
    );


  if (!button) {

    return;

  }


  const count =
    syncedFavoriteCodes.size;


  button.textContent =

    count > 0

      ? `⭐ Favorites (${count})`

      : "⭐ Favorites";

}


function refreshFavoriteButtons() {

  document
    .querySelectorAll(
      "[data-favorite-code]"
    )
    .forEach(button => {

      const code =
        button.getAttribute(
          "data-favorite-code"
        );


      const saved =
        isCodeFavorite(
          code
        );


      button.disabled =
        saved;


      button.textContent =

        saved

          ? "✓ Saved"

          : "⭐ Add to Favorites";


      button.style.opacity =

        saved

          ? "0.72"

          : "1";


      button.style.cursor =

        saved

          ? "default"

          : "pointer";

    });

}


function addLiveFavorite(groupIndex) {

  const group =
    latestLiveData[groupIndex];

  if (
    !group ||
    !group.current
  ) {

    showFavoriteToast(
      "No current CRS rate available.",
      false
    );

    return;
  }


  const current =
    group.current;


  let rate = null;


  if (
    current.firstCaseRate &&
    current.firstCaseRate.applicable !== false
  ) {

    rate =
      current.firstCaseRate;

  }

  else if (
    current.packages &&
    current.packages.length > 0
  ) {

    rate =
      current.packages[0];

  }


  if (!rate) {

    showFavoriteToast(
      "No case-rate amount available.",
      false
    );

    return;
  }


  const item = {

    code:
      group.code,

    description:
      group.description,

    caseRate:
      Number(
        rate.caseRate || 0
      ),

    hospitalFee:
      Number(
        rate.hospitalFee || 0
      ),

    professionalFee:
      Number(
        rate.professionalFee || 0
      ),

    effectivity:
      current.effectivity || "",

    source:
      "CRS"

  };


  const favoriteCode =
    String(
      item.code || ""
    )
      .trim()
      .toUpperCase();


  if (
    optimisticFavoriteCodes.has(
      favoriteCode
    )
  ) {

    showFavoriteToast(
      "Already saving this favorite...",
      true
    );

    return;
  }


  /*
   * INSTANT UI RESPONSE:
   * Do not wait for the server before confirming the tap.
   */
  optimisticFavoriteCodes.add(
    favoriteCode
  );


  syncedFavoriteCodes.add(
    favoriteCode
  );


  updateFavoritesCountBadge();


  setLiveFavoriteButtonState(
    groupIndex,
    true
  );


  showFavoriteToast(
    "⭐ Saved to Favorites",
    true
  );


  google.script.run

    .withSuccessHandler(result => {

      optimisticFavoriteCodes.delete(
        favoriteCode
      );


      if (
        result &&
        result.success === false
      ) {

        syncedFavoriteCodes.delete(
          favoriteCode
        );


        updateFavoritesCountBadge();


        setLiveFavoriteButtonState(
          groupIndex,
          false
        );


        showFavoriteToast(

          result.message ||
          "Unable to add favorite.",

          false

        );

        return;
      }


      /*
       * Keep the button in Saved state.
       * The actual database save is now complete.
       */
      setLiveFavoriteButtonState(
        groupIndex,
        true
      );

    })

    .withFailureHandler(error => {

      optimisticFavoriteCodes.delete(
        favoriteCode
      );


      /*
       * Revert the optimistic UI only when save fails.
       */
      syncedFavoriteCodes.delete(
        favoriteCode
      );


      updateFavoritesCountBadge();


      setLiveFavoriteButtonState(
        groupIndex,
        false
      );


      showFavoriteToast(

        "Unable to add favorite: " +

        (
          error &&
          error.message

            ? error.message

            : "Unknown error"
        ),

        false

      );

    })

    .addCHISFavorite(
      chisSessionToken,
      item
    );

}

/* =========================================================
   REMOVE FAVORITE
========================================================= */

function deleteFavorite(encodedCode) {

  const code =

    decodeURIComponent(
      encodedCode
    );


  if (
    !confirm(
      `Remove ${code} from Favorites?`
    )
  ) {

    return;

  }


  const normalizedCode =

    String(
      code || ""
    )
      .trim()
      .toUpperCase();


  /*
   * Instant local removal.
   */
  currentFavoriteRecords =

    currentFavoriteRecords

      .filter(
        item =>

          String(
            item.code || ""
          )
            .trim()
            .toUpperCase()

          !==

          normalizedCode

      );


  syncedFavoriteCodes.delete(
    normalizedCode
  );


  updateFavoritesCountBadge();


  renderFavorites(
    currentFavoriteRecords
  );


  showFavoriteToast(
    "🗑 Favorite removed",
    true
  );


  google.script.run

    .withSuccessHandler(result => {

      if (
        result &&
        result.success
      ) {

        return;

      }


      /*
       * If server removal failed, re-sync
       * to restore the correct account state.
       */
      showFavoriteToast(

        result &&
        result.message

          ? result.message

          : "Unable to remove favorite.",

        false

      );


      syncFavoritesState(
        favorites => {

          renderFavorites(
            favorites
          );

        }
      );

    })


    .withFailureHandler(error => {

      showFavoriteToast(

        "Unable to remove favorite: " +

        (
          error &&
          error.message

            ? error.message

            : "Unknown error"
        ),

        false

      );


      syncFavoritesState(
        favorites => {

          renderFavorites(
            favorites
          );

        }
      );

    })


    .removeCHISFavorite(
      chisSessionToken,
      code
    );

}


/* =========================================================
   SAVE SUCCESSFUL SEARCH TO HISTORY
========================================================= */

function saveSuccessfulSearchToHistory(keyword, liveData) {

  if (
    !Array.isArray(liveData) ||
    liveData.length === 0
  ) {
    return;
  }

  const group = liveData[0];

  if (!group) {
    return;
  }

  const current =
    group.current || null;

  let caseRate = 0;

  if (
    current &&
    current.firstCaseRate &&
    current.firstCaseRate.applicable !== false
  ) {

    caseRate =
      Number(
        current.firstCaseRate.caseRate || 0
      );

  }

  else if (
    current &&
    current.packages &&
    current.packages.length > 0
  ) {

    caseRate =
      Number(
        current.packages[0].caseRate || 0
      );

  }

  const historyItem = {

    keyword:
      String(keyword || ""),

    code:
      String(group.code || ""),

    description:
      String(group.description || ""),

    caseRate:
      caseRate,

    effectivity:
      current
        ? String(current.effectivity || "")
        : "",

    source:
      "CRS"

  };

  google.script.run

    .withFailureHandler(error => {

      console.error(
        "Unable to save search history:",
        error
      );

    })

    .saveCHISSearchHistory(
      chisSessionToken,
      historyItem
    );

}

/* =========================================================
   SAVE CURRENT USER PROFILE
========================================================= */

function saveCurrentUserProfile() {

  if (!currentCHISUser) {
    return;
  }


  const fullNameInput =
    document.getElementById(
      "userProfileFullName"
    );

  const hospitalInput =
    document.getElementById(
      "userProfileHospital"
    );

  const facilityTypeInput =
    document.getElementById(
      "userProfileFacilityType"
    );

  const messageBox =
    document.getElementById(
      "userProfileMessage"
    );


  const profile = {

    username:
      currentCHISUser.username || "",

    fullName:
      fullNameInput
        ? fullNameInput.value.trim()
        : "",

    hospital:
      hospitalInput
        ? hospitalInput.value.trim()
        : "",

    facilityType:
      facilityTypeInput
        ? facilityTypeInput.value
        : "others"

  };


  if (
    !profile.fullName ||
    !profile.hospital
  ) {

    if (messageBox) {

      messageBox.style.color =
        "#b42318";

      messageBox.textContent =
        "Full name and hospital are required.";

    }

    return;

  }


  if (messageBox) {

    messageBox.style.color =
      "#64748b";

    messageBox.textContent =
      "Saving profile...";

  }


  google.script.run

    .withSuccessHandler(result => {

      if (
        result &&
        result.success &&
        result.user
      ) {

        applyCurrentUser(
          result.user
        );

        if (messageBox) {

          messageBox.style.color =
            "#146c2e";

          messageBox.textContent =
            result.message ||
            "Profile saved successfully.";

        }

      } else {

        if (messageBox) {

          messageBox.style.color =
            "#b42318";

          messageBox.textContent =

            result &&
            result.message

              ? result.message

              : "Unable to save profile.";

        }

      }

    })

    .withFailureHandler(error => {

      if (messageBox) {

        messageBox.style.color =
          "#b42318";

        messageBox.textContent =

          error &&
          error.message

            ? error.message

            : "Unable to save profile.";

      }

    })

    .saveCHISUserProfileV307(
      chisSessionToken,
      profile
    );

}


/* =========================================================
   CHANGE OWN CHIS PASSWORD
========================================================= */

function changeOwnCHISPassword() {
  const currentInput=document.getElementById("currentUserPassword");
  const newInput=document.getElementById("newUserPassword");
  const confirmInput=document.getElementById("confirmNewUserPassword");
  const messageBox=document.getElementById("changeOwnPasswordMessage");
  const button=document.getElementById("changeOwnPasswordButton");

  const currentPassword=currentInput ? currentInput.value : "";
  const newPassword=newInput ? newInput.value : "";
  const confirmPassword=confirmInput ? confirmInput.value : "";

  if (!currentPassword) return setOwnPasswordMessage(messageBox,"Please enter your current password.",false);
  if (newPassword.length < 8 || !/[A-Z]/.test(newPassword) || !/[a-z]/.test(newPassword) || !/[0-9]/.test(newPassword) || !/[^A-Za-z0-9]/.test(newPassword)) return setOwnPasswordMessage(messageBox,"Use 8+ characters with uppercase, lowercase, number and special character.",false);
  if (newPassword !== confirmPassword) return setOwnPasswordMessage(messageBox,"New passwords do not match.",false);
  if (currentPassword === newPassword) return setOwnPasswordMessage(messageBox,"Your new password must be different from your current password.",false);

  if (button) {
    button.disabled=true;
    button.textContent="⏳ Changing Password...";
  }

  setOwnPasswordMessage(messageBox,"Verifying your current password...",true);

  google.script.run
    .withSuccessHandler(result => {
      if (button) {
        button.disabled=false;
        button.textContent="🔐 Change Password";
      }
      if (result && result.success) {
        if (currentInput) currentInput.value="";
        if (newInput) newInput.value="";
        if (confirmInput) confirmInput.value="";
        setOwnPasswordMessage(messageBox,result.message || "Password changed successfully.",true);
      } else {
        setOwnPasswordMessage(messageBox,(result && result.message) || "Unable to change password.",false);
      }
    })
    .withFailureHandler(error => {
      if (button) {
        button.disabled=false;
        button.textContent="🔐 Change Password";
      }
      setOwnPasswordMessage(messageBox,(error && error.message) || "Unable to change password.",false);
    })
    .changeOwnCHISPasswordV307(chisSessionToken,currentPassword,newPassword);
}

function setOwnPasswordMessage(element,message,success) {
  if (!element) return;
  element.style.color=success ? "#146c2e" : "#b42318";
  element.textContent=message;
}

function buildFacilityMatchBanner(
  facilities
) {

  const facilityName =

    (
      currentCHISUser &&
      currentCHISUser.hospital
    )

      ||

    chisSettings.facilityName

      ||

    "Configured Facility";


  const facilityType =

    String(
      (
        currentCHISUser &&
        currentCHISUser.facilityType
      )

      ||

      chisSettings.facilityType

      ||

      "level2"
    )
      .trim()
      .toLowerCase();


  if (!facilities) {

    return `

      <div
        style="
          margin:12px 0 16px;
          padding:12px 14px;
          border-radius:8px;
          background:#f8fafc;
          border:1px solid #e2e8f0;
          color:#64748b;
          font-weight:600;
        ">

        ℹ Facility applicability could not be determined for
        ${escapeHtml(facilityName)}.

      </div>

    `;

  }


  if (
    !Object.prototype
      .hasOwnProperty
      .call(
        facilities,
        facilityType
      )
  ) {

    return `

      <div
        style="
          margin:12px 0 16px;
          padding:12px 14px;
          border-radius:8px;
          background:#f8fafc;
          border:1px solid #e2e8f0;
          color:#64748b;
          font-weight:600;
        ">

        ℹ Facility applicability is unavailable for the
        configured facility type.

      </div>

    `;

  }


  const applicable =

    Boolean(
      facilities[
        facilityType
      ]
    );


  if (applicable) {

    return `

      <div
        style="
          margin:12px 0 16px;
          padding:12px 14px;
          border-radius:8px;
          background:#d8f3df;
          border:1px solid #b7dfc2;
          color:#146c2e;
          font-weight:800;
        ">

        ✅ Applicable to
        ${escapeHtml(facilityName)}

      </div>

    `;

  }


  return `

    <div
      style="
        margin:12px 0 16px;
        padding:12px 14px;
        border-radius:8px;
        background:#fff3cd;
        border:1px solid #ffe69c;
        color:#856404;
        font-weight:800;
      ">

      ⚠ Not applicable to
      ${escapeHtml(facilityName)}
      based on the configured facility type.

    </div>

  `;

}


/* =========================================================
   BUILD FIRST / SECOND CASE RATE
========================================================= */

function buildCaseRates(record) {

  if (!record) {

    return "";

  }


  const first =
    record.firstCaseRate;


  const second =
    record.secondCaseRate;


  let html = `

    <div class="package-grid">

  `;


  /* FIRST CASE RATE */

  if (

    first &&

    first.applicable !== false

  ) {

    html += `

      <div class="package-box">


        <div class="package-label">

          First Case Rate

        </div>


        <div class="package-rate">

          ${formatPeso(
            first.caseRate
          )}

        </div>


        <div class="package-breakdown">

          HCI:

          ${formatPeso(
            first.hospitalFee
          )}

          <br>

          PF:

          ${formatPeso(
            first.professionalFee
          )}

        </div>


      </div>

    `;

  }


  /* SECOND CASE RATE */

  if (second) {

    if (second.applicable) {

      html += `

        <div class="package-box">


          <div class="package-label">

            Second Case Rate

          </div>


          <div class="package-rate">

            ${formatPeso(
              second.caseRate
            )}

          </div>


          <div class="package-breakdown">

            HCI:

            ${formatPeso(
              second.hospitalFee
            )}

            <br>

            PF:

            ${formatPeso(
              second.professionalFee
            )}

          </div>


        </div>

      `;

    } else {

      html += `

        <div class="package-box">


          <div class="package-label">

            Second Case Rate

          </div>


          <div
            class="package-rate not-applicable-rate">

            Not Applicable

          </div>


        </div>

      `;

    }

  }


  /* OLD FORMAT FALLBACK */

  if (

    !first &&

    record.packages

  ) {

    record.packages.forEach(

      (pkg, index) => {

        html += `

          <div class="package-box">


            <div class="package-label">

              ${
                index === 0

                  ? "First Case Rate"

                  : index === 1

                  ? "Second Case Rate"

                  : `Package ${index + 1}`
              }

            </div>


            <div class="package-rate">

              ${formatPeso(
                pkg.caseRate
              )}

            </div>


            <div class="package-breakdown">

              HCI:

              ${formatPeso(
                pkg.hospitalFee
              )}

              <br>

              PF:

              ${formatPeso(
                pkg.professionalFee
              )}

            </div>


          </div>

        `;

      }

    );

  }


  html += `

    </div>

  `;


  return html;

}

========================================================= */

function buildLocalResult(

  local,

  liveMatch

) {

  const localRate =

    Number(
      local.caseRate || 0
    );


  let liveRate = null;


  if (

    liveMatch &&

    liveMatch.current

  ) {


    if (

      liveMatch.current
        .firstCaseRate

    ) {

      liveRate =

        Number(

          liveMatch.current
            .firstCaseRate
            .caseRate || 0

        );


    } else if (

      liveMatch.current
        .packages &&

      liveMatch.current
        .packages[0]

    ) {

      liveRate =

        Number(

          liveMatch.current
            .packages[0]
            .caseRate || 0

        );

    }

  }


  const isDifferent =

    liveRate !== null &&

    localRate !== liveRate;


  return `

    <div class="card">


      <div class="type">

        LOCAL DATABASE

      </div>


      <div class="code">

        ${escapeHtml(
          local.code
        )}

      </div>


      <div>

        ${escapeHtml(
          local.description
        )}

      </div>


      ${
        isDifferent

          ? `

            <div class="outdated-badge">

              ⚠ LOCAL RATE DIFFERS FROM CURRENT CRS

            </div>

          `

          : ""
      }


      <div class="money">


        💰
        <b>Local Case Rate:</b>

        ${formatPeso(
          local.caseRate
        )}


        <br>


        🏥
        <b>Local HCI Fee:</b>

        ${formatPeso(

          local.hospitalFee ??

          local.hfFee

        )}


        <br>


        👨‍⚕️
        <b>Local PF Fee:</b>

        ${formatPeso(

          local.professionalFee ??

          local.pfFee

        )}


      </div>


      ${
        isDifferent

          ? `

            <div class="rate-comparison">


              <b>

                Current Official CRS:

              </b>


              ${formatPeso(
                liveRate
              )}


            </div>

          `

          : ""
      }


    </div>

  `;

}


/* =========================================================
   FIND MATCHING LIVE CRS CODE
========================================================= */

function findLiveMatch(

  liveData,

  code

) {

  if (
    !liveData ||
    !Array.isArray(liveData)
  ) {
    return null;
  }

  const normalizedCode =
    normalizeCHISMedicalCodeForMatch(code);

  return (
    liveData.find(item =>
      normalizeCHISMedicalCodeForMatch(
        item && item.code
      ) === normalizedCode
    ) || null
  );

}

/* =========================================================
   PESO FORMATTER
========================================================= */

function formatPeso(value) {

  const amount =

    Number(
      value || 0
    );


  return "₱" +

    amount.toLocaleString(

      "en-PH",

      {

        minimumFractionDigits: 0,

        maximumFractionDigits: 2

      }

    );

}


/* =========================================================
   HTML ESCAPE
========================================================= */

function escapeHtml(value) {

  return String(

    value ?? ""

  )

    .replace(

      /&/g,

      "&amp;"

    )

    .replace(

      /</g,

      "&lt;"

    )

    .replace(

      />/g,

      "&gt;"

    )

    .replace(

      /"/g,

      "&quot;"

    )

    .replace(

      /'/g,

      "&#039;"

    );

}

function updateBulkSyncFailedBadge(count) {
  const badge = document.getElementById("bulkSyncFailedBadge");
  const retryButton = document.getElementById("bulkSyncRetryButton");
  const failed = Math.max(0, Number(count || 0));

  if (badge) {
    badge.textContent = String(failed);
    badge.className = "bulk-sync-failed-badge " + (
      failed === 0 ? "is-healthy" : failed <= 20 ? "is-warning" : "is-danger"
    );
  }

  if (retryButton) {
    retryButton.disabled = bulkCRSSyncRunning || failed === 0;
    retryButton.style.opacity = retryButton.disabled ? "0.6" : "1";
    retryButton.innerHTML = `🟠 Retry Failed (${failed})`;
  }
}

function renderAdminBulkCRSSyncStatus(state) {
  if (!state) return;

  const statusText = document.getElementById("bulkSyncStatusText");
  const percentText = document.getElementById("bulkSyncPercentText");
  const progressBar = document.getElementById("bulkSyncProgressBar");
  const counts = document.getElementById("bulkSyncCounts");
  const recoveredCard = document.getElementById("bulkSyncRecoveredValue");
  const remainingCard = document.getElementById("bulkSyncRemainingFailedValue");
  const recoveryRateCard = document.getElementById("bulkSyncRecoveryRateValue");
  const successRateCard = document.getElementById("bulkSyncSuccessRateValue");

  const status = String(state.status || "IDLE").trim().toUpperCase();
  const mode = String(state.mode || "NORMAL").trim().toUpperCase();
  const percent = Math.max(0, Math.min(100, Number(state.percent || 0)));

  if (statusText) {
    if (status === "RUNNING") {
      statusText.textContent = mode === "RETRY"
        ? "Retrying failed CRS records..."
        : `Syncing ${state.type || "CRS"} database...`;
    } else if (status === "COMPLETED") {
      statusText.textContent = mode === "RETRY"
        ? "✅ Failed-record retry completed"
        : `✅ ${state.type || "CRS"} sync completed`;
    } else {
      statusText.textContent = "No active bulk sync session";
    }
  }

  if (percentText) percentText.textContent = `${percent}%`;
  if (progressBar) progressBar.style.width = `${percent}%`;

  if (counts) {
    counts.textContent =
      `Processed: ${Number(state.processed || 0)} / ${Number(state.total || 0)}` +
      ` · Updated: ${Number(state.updated || 0)}` +
      ` · Unchanged: ${Number(state.unchanged || 0)}` +
      ` · Added: ${Number(state.added || 0)}` +
      ` · Failed this run: ${Number(state.failed || 0)}`;
  }

  if (recoveredCard) recoveredCard.textContent = Number(state.recovered || 0);
  if (remainingCard) remainingCard.textContent = Number(state.failedRemaining || 0);
  if (recoveryRateCard) recoveryRateCard.textContent = `${Number(state.recoveryRate || 0)}%`;
  if (successRateCard) successRateCard.textContent = `${Number(state.successRate || 0)}%`;

  bulkCRSSyncRunning = status === "RUNNING";
  setBulkSyncButtonsDisabled(bulkCRSSyncRunning);
  updateBulkSyncFailedBadge(state.failedRemaining || 0);
}

function refreshAdminBulkCRSSyncStatus() {
  if (!isCurrentCHISUserAdmin() || !document.getElementById("bulkSyncStatusBox")) return;

  google.script.run
    .withSuccessHandler(state => renderAdminBulkCRSSyncStatus(state))
    .withFailureHandler(error => {
      const statusText = document.getElementById("bulkSyncStatusText");
      if (statusText) {
        statusText.textContent = error && error.message
          ? error.message
          : "Unable to load bulk sync status.";
      }
    })
    .getBulkCRSSyncStatus(chisSessionToken);
}

function startAdminBulkCRSSync(type) {
  if (!isCurrentCHISUserAdmin()) {
    alert("Administrator access required.");
    return;
  }

  const message = type === "ALL"
    ? "Start bulk synchronization for both ICD and RVS databases?"
    : `Start bulk synchronization for the ${type} database?`;

  if (!confirm(message)) return;

  prepareAdminBulkSyncStart_("Preparing bulk sync queue...");

  google.script.run
    .withSuccessHandler(handleAdminBulkSyncStarted_)
    .withFailureHandler(handleAdminBulkSyncFailure_)
    .startBulkCRSSync(chisSessionToken, type);
}

function retryAllFailedBulkCRSSync() {
  const failedCount = Number(
    (document.getElementById("bulkSyncFailedBadge") || {}).textContent || 0
  );

  if (failedCount <= 0) {
    alert("There are no failed CRS records to retry.");
    return;
  }

  if (!confirm(`Retry all ${failedCount} failed CRS record(s)?`)) return;

  prepareAdminBulkSyncStart_("Preparing failed-record retry queue...");

  google.script.run
    .withSuccessHandler(handleAdminBulkSyncStarted_)
    .withFailureHandler(handleAdminBulkSyncFailure_)
    .startRetryFailedBulkCRSSync(chisSessionToken, []);
}

function retrySelectedFailedBulkCRSSync() {
  const selected = Array.from(
    document.querySelectorAll('.bulk-failed-select:checked')
  ).map(input => input.value);

  if (selected.length === 0) {
    alert("Select at least one failed record.");
    return;
  }

  if (!confirm(`Retry the ${selected.length} selected failed record(s)?`)) return;

  prepareAdminBulkSyncStart_("Preparing selected retry queue...");

  google.script.run
    .withSuccessHandler(state => {
      closeBulkSyncFailedViewer();
      handleAdminBulkSyncStarted_(state);
    })
    .withFailureHandler(handleAdminBulkSyncFailure_)
    .startRetryFailedBulkCRSSync(chisSessionToken, selected);
}

function prepareAdminBulkSyncStart_(message) {
  clearTimeout(bulkCRSSyncPollTimer);
  bulkCRSSyncRunning = true;
  setBulkSyncButtonsDisabled(true);

  const statusText = document.getElementById("bulkSyncStatusText");
  if (statusText) statusText.textContent = message;
}

function handleAdminBulkSyncStarted_(state) {
  renderAdminBulkCRSSyncStatus(state);

  if (state && String(state.status || "").toUpperCase() === "RUNNING") {
    runNextAdminBulkCRSSyncBatch();
  }
}

function handleAdminBulkSyncFailure_(error) {
  bulkCRSSyncRunning = false;
  setBulkSyncButtonsDisabled(false);

  alert(error && error.message
    ? error.message
    : "Unable to start bulk CRS synchronization.");
}

function runNextAdminBulkCRSSyncBatch() {
  if (!bulkCRSSyncRunning || !isCurrentCHISUserAdmin()) return;

  google.script.run
    .withSuccessHandler(state => {
      renderAdminBulkCRSSyncStatus(state);

      if (state && String(state.status || "").toUpperCase() === "RUNNING") {
        bulkCRSSyncPollTimer = setTimeout(runNextAdminBulkCRSSyncBatch, 350);
        return;
      }

      bulkCRSSyncRunning = false;
      setBulkSyncButtonsDisabled(false);
      refreshAdminBulkCRSSyncStatus();
    })
    .withFailureHandler(error => {
      bulkCRSSyncRunning = false;
      setBulkSyncButtonsDisabled(false);

      const statusText = document.getElementById("bulkSyncStatusText");
      if (statusText) {
        statusText.textContent = "Bulk sync paused: " + (
          error && error.message ? error.message : "Unknown error"
        );
      }
    })
    .runNextBulkCRSSyncBatch(chisSessionToken);
}

function resetAdminBulkCRSSync() {
  if (!isCurrentCHISUserAdmin()) {
    alert("Administrator access required.");
    return;
  }

  if (bulkCRSSyncRunning) {
    alert("Please wait for the current batch to finish before resetting the session.");
    return;
  }

  if (!confirm("Reset the saved bulk sync session and progress? Failed records will remain available.")) {
    return;
  }

  google.script.run
    .withSuccessHandler(state => renderAdminBulkCRSSyncStatus(state))
    .withFailureHandler(error => alert(
      error && error.message ? error.message : "Unable to reset bulk sync session."
    ))
    .resetBulkCRSSync(chisSessionToken);
}

========================================================= */

  keyword
) {

  adminUserSearchKeyword =
    String(
      keyword || ""
    );

    document.getElementById(

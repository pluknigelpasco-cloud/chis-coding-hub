/* =========================================================
   PENDING USERS BADGE
========================================================= */

function updatePendingUsersBadge(
  count
) {

  const badge =
    document.getElementById(
      "pendingUsersBadge"
    );


  if (!badge) {
    return;
  }


  const total =
    Number(count || 0);


  badge.textContent =
    total > 99
      ? "99+"
      : String(total);


  badge.style.display =

    total > 0

      ? "inline-flex"

      : "none";

}


/* =========================================================
   REFRESH PENDING USERS BADGE
========================================================= */

function refreshPendingUsersBadge() {

  if (
    !currentCHISUser ||
    String(
      currentCHISUser.role || ""
    )
      .trim()
      .toUpperCase()
    !==
    "ADMIN"
  ) {

    updatePendingUsersBadge(0);

    return;

  }


  google.script.run

    .withSuccessHandler(users => {

      const data =
        Array.isArray(users)
          ? users
          : [];


      const pendingCount =

        data.filter(
          user =>
            String(
              user.status || ""
            )
              .trim()
              .toUpperCase()
            ===
            "PENDING"
        ).length + data.filter(user => Boolean(user.passwordResetRequested)).length;


      updatePendingUsersBadge(
        pendingCount
      );

    })

    .withFailureHandler(() => {

      /*
       * Keep the current badge unchanged
       * if the background refresh fails.
       */

    })

    .getCHISUsersForAdminV307(
      chisSessionToken
    );

}

/* =========================================================
   ADMIN CHANGE USER STATUS
========================================================= */

function adminChangeUserStatus(
  encodedUsername,
  status
) {

  const username =
    decodeURIComponent(
      encodedUsername
    );


  const actionLabel =

    status === "ACTIVE"

      ? "activate"

      : "deactivate";


  if (

    !confirm(

      `Are you sure you want to ${actionLabel} ${username}?`

    )

  ) {

    return;

  }


  google.script.run

    .withSuccessHandler(result => {

      if (
        result &&
        result.success
      ) {

        refreshPendingUsersBadge();
        showUserManagement();

      } else {

        alert(

          result &&
          result.message

            ? result.message

            : "Unable to update user status."

        );

      }

    })


    .withFailureHandler(error => {

      alert(

        error &&
        error.message

          ? error.message

          : "Unable to update user status."

      );

    })


    .adminUpdateCHISUserStatusV307(

      chisSessionToken,

      username,

      status

    );

}

  const username =

    showUserManagement();

        showUserManagement();

    .adminUpdateCHISUserRoleV307(

    );

}

/* =========================================================
   ADMIN SUBMIT PASSWORD RESET
========================================================= */

function submitAdminPasswordReset(
  encodedUsername
) {

  const username =
    decodeURIComponent(
      encodedUsername || ""
    );


  const passwordInput =
    document.getElementById(
      "adminResetPassword"
    );


  const confirmInput =
    document.getElementById(
      "adminResetConfirmPassword"
    );


  const messageBox =
    document.getElementById(
      "adminPasswordResetMessage"
    );


  const button =
    document.getElementById(
      "adminSavePasswordButton"
    );


  const password =
    passwordInput
      ? passwordInput.value
      : "";


  const confirmPassword =
    confirmInput
      ? confirmInput.value
      : "";


  if (
    password.length < 8 ||
    !/[A-Z]/.test(password) ||
    !/[a-z]/.test(password) ||
    !/[0-9]/.test(password) ||
    !/[^A-Za-z0-9]/.test(password)
  ) {

    if (messageBox) {

      messageBox.style.color =
        "#b42318";

      messageBox.textContent =
        "Use 8+ characters with uppercase, lowercase, number and special character.";

    }

    return;

  }


  if (
    password !==
    confirmPassword
  ) {

    if (messageBox) {

      messageBox.style.color =
        "#b42318";

      messageBox.textContent =
        "Passwords do not match.";

    }

    return;

  }


  if (
    !confirm(
      `Set a new CHIS password for ${username}?`
    )
  ) {

    return;

  }


  if (button) {

    button.disabled =
      true;

    button.innerHTML =
      "Saving Password...";

  }


  if (messageBox) {

    messageBox.style.color =
      "#64748b";

    messageBox.textContent =
      "Updating user password...";

  }


  google.script.run

    .withSuccessHandler(result => {

      if (
        result &&
        result.success
      ) {

        if (messageBox) {

          messageBox.style.color =
            "#146c2e";

          messageBox.textContent =

            result.message ||

            "Password updated successfully.";

        }


        if (button) {

          button.innerHTML =
            "Password Updated";

        }


        setTimeout(
          () => {

            showUserManagement();

          },
          900
        );


        return;

      }


      if (button) {

        button.disabled =
          false;

        button.innerHTML =
          "Save New Password";

      }


      if (messageBox) {

        messageBox.style.color =
          "#b42318";

        messageBox.textContent =

          result &&
          result.message

            ? result.message

            : "Unable to update user password.";

      }

    })


    .withFailureHandler(error => {

      if (button) {

        button.disabled =
          false;

        button.innerHTML =
          "Save New Password";

      }


      if (messageBox) {

        messageBox.style.color =
          "#b42318";

        messageBox.textContent =

          error &&
          error.message

            ? error.message

            : "Unable to update user password.";

      }

    })


    .adminSetCHISUserPasswordV307(

      chisSessionToken,

      username,

      password

    );

}

function formatFacilityTypeLabel(
  type
) {

  const labels = {

    level1:
      "Level 1 Hospital",

    level2:
      "Level 2 Hospital",

    level3:
      "Level 3 Hospital",

    infirmary:
      "Infirmary",

    asc:
      "Ambulatory Surgical Clinic",

    pcf:
      "Primary Care Facility",

    mcp:
      "Maternity Care Package Provider",

    fsdc:
      "Freestanding Dialysis Clinic",

    others:
      "Other Health Care Institution"

  };


  const normalized =

    String(
      type || ""
    )
      .trim()
      .toLowerCase();


  return (

    labels[normalized]

    ||

    type

    ||

    "Not specified"

  );

}


/* =========================================================
   ADMIN DATE FORMATTER
========================================================= */

function formatAdminDate(
  value
) {

  if (!value) {

    return "Not available";

  }


  const date =
    new Date(
      value
    );


  if (
    Number.isNaN(
      date.getTime()
    )
  ) {

    return String(
      value
    );

  }


  return date.toLocaleString(
    "en-PH",
    {
      year:
        "numeric",

      month:
        "short",

      day:
        "numeric",

      hour:
        "numeric",

      minute:
        "2-digit"
    }
  );

}

  clearTimeout(
    bulkCRSSyncPollTimer
  );


  bulkCRSSyncRunning =
    false;


  chisSessionToken = "";

  localStorage.removeItem(
    "chis_session_token"
  );

  adminUsersData = [];
  adminUserStatusFilter = "ALL";
  adminUserSearchKeyword = "";

  syncedFavoriteCodes =
    new Set();

  currentFavoriteRecords =

  optimisticFavoriteCodes =
    new Set();

  updateFavoritesCountBadge();

  updatePendingUsersBadge(0);


  const headerUserName =
    document.getElementById(
      "headerUserName"
    );

  if (headerUserName) {

    headerUserName.textContent =
      "CHIS User";

    document.getElementById(

    document.getElementById(
      "menuUserManagement"
    );

  }


  showLoginScreen();


  if (token) {

    google.script.run
      .withFailureHandler(() => {})
      .logoutCHISSessionV307(
        token
      );

  }

}
/* =====================================================
   CHIS v3.2.0
   MOBILE NAVIGATION + QUICK ACTIONS
===================================================== */
(function initializeCHISV3Interface() {

    function startCHISV3Interface() {

        const mobileMenuButton =
            document.getElementById("mobileMenuButton");

        const closeSidebarButton =
            document.getElementById("closeSidebarButton");

        const sidebarOverlay =
            document.getElementById("sidebarOverlay");

        const appSidebar =
            document.getElementById("appSidebar");

        const searchInput =
            document.getElementById("search");

        const greetingElement =
            document.getElementById("welcomeGreeting");

        const mobileBreakpoint =
            window.matchMedia("(max-width: 700px)");

        if (
            !mobileMenuButton ||
            !sidebarOverlay ||
            !appSidebar
        ) {
            return;
        }

        /* =============================================
           GREETING
        ============================================= */
        function updateCHISGreeting() {

            if (!greetingElement) {
                return;
            }

            const hour = new Date().getHours();

            let greeting = "Welcome";

            if (hour < 12) {
                greeting = "Good morning";
            } else if (hour < 18) {
                greeting = "Good afternoon";
            } else {
                greeting = "Good evening";
            }

            greetingElement.textContent =
                greeting + " 👋";
        }

        /* =============================================
           OPEN MOBILE DRAWER
        ============================================= */
        function openCHISMobileDrawer() {

            if (!mobileBreakpoint.matches) {
                return;
            }

            appSidebar.classList.add("is-open");
            sidebarOverlay.classList.add("is-visible");
            document.body.classList.add("chis-drawer-open");

            mobileMenuButton.setAttribute(
                "aria-expanded",
                "true"
            );

            sidebarOverlay.setAttribute(
                "aria-hidden",
                "false"
            );

            appSidebar.setAttribute(
                "aria-hidden",
                "false"
            );

            window.setTimeout(function () {

                if (closeSidebarButton) {
                    closeSidebarButton.focus();
                }

            }, 100);
        }

        /* =============================================
           CLOSE MOBILE DRAWER
        ============================================= */
        function closeCHISMobileDrawer(options) {

            const settings = options || {};

            appSidebar.classList.remove("is-open");
            sidebarOverlay.classList.remove("is-visible");
            document.body.classList.remove("chis-drawer-open");

            mobileMenuButton.setAttribute(
                "aria-expanded",
                "false"
            );

            sidebarOverlay.setAttribute(
                "aria-hidden",
                "true"
            );

            if (mobileBreakpoint.matches) {

                appSidebar.setAttribute(
                    "aria-hidden",
                    "true"
                );

            } else {

                appSidebar.setAttribute(
                    "aria-hidden",
                    "false"
                );
            }

            if (settings.returnFocus === true) {
                mobileMenuButton.focus();
            }
        }

        /* =============================================
           DRAWER EVENTS
        ============================================= */
        mobileMenuButton.addEventListener(
            "click",
            openCHISMobileDrawer
        );

        if (closeSidebarButton) {

            closeSidebarButton.addEventListener(
                "click",
                function () {

                    closeCHISMobileDrawer({
                        returnFocus: true
                    });
                }
            );
        }

        sidebarOverlay.addEventListener(
            "click",
            function () {

                closeCHISMobileDrawer({
                    returnFocus: true
                });
            }
        );

        document.addEventListener(
            "keydown",
            function (event) {

                if (
                    event.key === "Escape" &&
                    appSidebar.classList.contains("is-open")
                ) {

                    closeCHISMobileDrawer({
                        returnFocus: true
                    });
                }
            }
        );

        /* =============================================
           CLOSE DRAWER AFTER NAVIGATION
        ============================================= */
        document
            .querySelectorAll(".menu-btn")
            .forEach(function (button) {

                button.addEventListener(
                    "click",
                    function () {

                        if (mobileBreakpoint.matches) {

                            closeCHISMobileDrawer({
                                returnFocus: false
                            });
                        }
                    }
                );
            });

        /* =============================================
           RESPONSIVE BREAKPOINT CHANGES
        ============================================= */
        function handleCHISBreakpointChange(event) {

            if (!event.matches) {

                closeCHISMobileDrawer({
                    returnFocus: false
                });

                appSidebar.setAttribute(
                    "aria-hidden",
                    "false"
                );

            } else if (
                !appSidebar.classList.contains("is-open")
            ) {

                appSidebar.setAttribute(
                    "aria-hidden",
                    "true"
                );
            }
        }

        if (
            typeof mobileBreakpoint.addEventListener ===
            "function"
        ) {

            mobileBreakpoint.addEventListener(
                "change",
                handleCHISBreakpointChange
            );

        } else if (
            typeof mobileBreakpoint.addListener ===
            "function"
        ) {

            mobileBreakpoint.addListener(
                handleCHISBreakpointChange
            );
        }

        /* =============================================
           QUICK SEARCH ACTIONS
        ============================================= */
        document
            .querySelectorAll("[data-chis-focus-search]")
            .forEach(function (button) {

                button.addEventListener(
                    "click",
                    function () {

                        if (!searchInput) {
                            return;
                        }

                        const newPlaceholder =
                            button.getAttribute(
                                "data-search-placeholder"
                            );

                        if (newPlaceholder) {
                            searchInput.placeholder =
                                newPlaceholder;
                        }

                        searchInput.scrollIntoView({
                            behavior: "smooth",
                            block: "center"
                        });

                        window.setTimeout(function () {
                            searchInput.focus();
                        }, 250);
                    }
                );
            });

        /* =============================================
           QUICK NAVIGATION ACTIONS
        ============================================= */
        document
            .querySelectorAll("[data-chis-menu-target]")
            .forEach(function (button) {

                button.addEventListener(
                    "click",
                    function () {

                        const targetId =
                            button.getAttribute(
                                "data-chis-menu-target"
                            );

                        const targetButton =
                            document.getElementById(
                                targetId
                            );

                        if (targetButton) {
                            targetButton.click();
                        }
                    }
                );
            });

        /* =============================================
           INITIAL UI STATE
        ============================================= */
        updateCHISGreeting();

        if (mobileBreakpoint.matches) {

            appSidebar.setAttribute(
                "aria-hidden",
                "true"
            );

        } else {

            appSidebar.setAttribute(
                "aria-hidden",
                "false"
            );
        }
    }

    if (document.readyState === "loading") {

        document.addEventListener(
            "DOMContentLoaded",
            startCHISV3Interface,
            {
                once: true
            }
        );

    } else {

        startCHISV3Interface();
    }

})();

function submitAdminCreateUser() {
  const getValue = id => (document.getElementById(id) || {}).value || "";
  const profile = {
    username: getValue("adminCreateUsername").trim(), fullName: getValue("adminCreateFullName").trim(),
    role: getValue("adminCreateRole"), facilityType: getValue("adminCreateFacilityType"),
    hospital: getValue("adminCreateHospital").trim(), password: getValue("adminCreatePassword")
  };
  const confirmPassword = getValue("adminCreateConfirm");
  const message = document.getElementById("adminCreateMessage");
  const strong = profile.password.length >= 8 && /[A-Z]/.test(profile.password) && /[a-z]/.test(profile.password) && /[0-9]/.test(profile.password) && /[^A-Za-z0-9]/.test(profile.password);
  if (!profile.username || !profile.fullName || !profile.hospital) {
    message.style.color = "#b42318"; message.textContent = "Username, full name and hospital are required."; return;
  }
  if (!strong) {
    message.style.color = "#b42318"; message.textContent = "Password needs 8+ characters with uppercase, lowercase, number and special character."; return;
  }
  if (profile.password !== confirmPassword) {
    message.style.color = "#b42318"; message.textContent = "Passwords do not match."; return;
  }
  const button = document.getElementById("adminCreateSaveButton");
  button.disabled = true; button.textContent = "Creating...";
  google.script.run
    .withSuccessHandler(result => {
      if (result && result.success) { alert(result.message || "Account created."); showUserManagement(); return; }
      button.disabled = false; button.textContent = "Create & Activate";
      message.style.color = "#b42318"; message.textContent = (result && result.message) || "Unable to create account.";
    })
    .withFailureHandler(error => {
      button.disabled = false; button.textContent = "Create & Activate";
      message.style.color = "#b42318"; message.textContent = (error && error.message) || "Unable to create account.";
    })
    .adminCreateCHISUserV307(chisSessionToken, profile);
}
